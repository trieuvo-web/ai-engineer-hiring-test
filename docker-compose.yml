services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ruleengine
      POSTGRES_PASSWORD: ruleengine
      POSTGRES_DB: ruleengine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
